[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Reproducible NLP and SQL analysis of Australian data job advertisements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "joblib>=1.4,<2",
  "pandas>=2.2,<4",
  "plotly>=5.24,<7",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
